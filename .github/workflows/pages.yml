name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Refuse broken data, missing screenshots, private details or risky claims.
      - name: Check the site
        run: node tools/check.mjs
      # Load the page in a real browser at phone, tablet and desktop sizes: layout, accessibility,
      # keyboard use, screenshots, assistant, security policy and what search engines read.
      - name: Install test tools
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tools/browser-test.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the site files, not the repo's docs, tools or workflow.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css app.js projects.js chat.js _site/
          cp -r images fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
